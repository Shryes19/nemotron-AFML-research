[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wm"
version = "0.1.0"
description = "Team Nemotron: environment wrappers and transition data pipeline"
requires-python = ">=3.8"
dependencies = ["requests", "pyyaml", "numpy", "pytest", "huggingface_hub"]

[tool.setuptools.packages.find]
include = ["wm*"]
