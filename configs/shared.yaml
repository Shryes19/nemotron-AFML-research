# Data-pipeline settings (wm/). Read through wm/config.py.
# Budgets and the expert/random/LLM mix are NOT here: they come from configs/config.yaml
# (data.budgets, data.collection_policy), the team's single source of truth.
# Random-policy details are constants in wm/policies.py (ScienceWorld samples verb-first;
# ALFWorld uses a non-admissible, failing command on ALFWORLD_FAIL_RATE of random steps).

# Shuffle seeds for the nested budgets (one budget file set per seed). Not the same thing as
# the training seed (`seed` in config.yaml).
budget_seeds: [0, 1, 2]

pool_targets:
  train: {expert: 800, random: 480, llm: 320}
  heldout: {expert: 150, random: 90, llm: 60}

envs:
  word2world_commit: e8dc240269fb222de3c242b09c70bfbf0b4ac1c9
  alfworld: {package: "alfworld==0.3.3", python: "3.9", data: "X1AOX1A/LLMasWorldModels:alfworld.zip"}
  sciworld: {package: "scienceworld (via AgentGym agentenv-sciworld)", python: "3.8", java: "17"}

splits:
  source: "huggingface dataset X1AOX1A/LLMasWorldModels"
  alfworld: {train: splits/alfworld_train.json, heldout: splits/alfworld_test.json}
  sciworld: {train: splits/sciworld_train.json, heldout: splits/sciworld_test.json}

# LLM used as the data-collection policy (wm/llm_policy.py), via LLM_BASE_URL.
collection_llm:
  model: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
