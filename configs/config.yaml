# ── Global config for Team Nemotron RQ3 ──────────────────────────────────────
# All paths are relative to repo root unless they start with /

seed: 42

# ── Encoder ───────────────────────────────────────────────────────────────────
encoder:
  # Primary: Nemotron-Embed-8B quantized to NF4 (~5-6GB VRAM on RTX 5070 12GB)
  # Swap: set model_name to "BAAI/bge-large-en-v1.5" for fast CPU prototyping
  model_name: "nvidia/NV-Embed-v2"   # Nemotron-Embed-8B
  quantize: true                      # NF4 4-bit — set false if using smaller encoder
  device: "cuda"
  batch_size: 16                      # 32 nearly filled 12GB on long ALFWorld observations
  max_length: 512

# ── JEPA predictor ────────────────────────────────────────────────────────────
jepa:
  predictor_type: "mlp"               # "mlp" | "transformer" — swap here
  input_mode: "separate"              # "separate" = [z_obs | z_action] (better on ALFWorld,
                                      #   2026-10-31) | "joint" = one "action + obs" text
  admissible_feature: true            # add "is the action in the [ADMISSIBLE] list" to the
                                      #   input (jepa/training/features.py); fixes failed-action
                                      #   predictions at small budgets
  hidden_dim: 2048
  num_layers: 2
  dropout: 0.1
  ema_decay: 0.996                    # V-JEPA style EMA for target encoder
  loss: "mse"                         # "mse" | "l1" (V-JEPA 2-AC uses L1) | "infonce" (VL-JEPA)
  infonce_temperature: 0.05           # only used with loss: infonce
  target_mode: "frozen"               # "frozen" = predict frozen NV-Embed vectors directly,
                                      #   no projection/EMA (DINO-WM style) — DEFAULT since the
                                      #   2026-11-01 ablation: as good overall, better at
                                      #   n <= 128, can't collapse. "ema" = learned projection
                                      #   + EMA target (original); ~1-6 pts better at n=1024.
                                      #   L1 loss was worse than MSE in both.

# ── Training ──────────────────────────────────────────────────────────────────
training:
  epochs: 20                          # only used when steps is null
  steps: 2000                         # same number of training steps for EVERY budget;
                                      #   fixed epochs left small budgets under-trained
                                      # NO early stopping: tested 2026-11-01 on unseen games,
                                      #   stopping at the best validation-game checkpoint scored
                                      #   WORSE than the full 2000 steps at every budget
  probe_steps: 50                     # Feature 1 = 50 optimiser steps on n=32 (decided
                                      #   2026-11-01: separates ALFWorld games, ratio 1.63,
                                      #   stable ranking; 1 epoch = 1 step did not, 0.80)
  probe_epochs: 1                     # only used if probe_steps is null or --probe-epochs is given
  lr: 1e-4
  weight_decay: 1e-4
  held_out_frac: 0.1                  # fraction of buffer held out for eval
  log_every: 5                        # log loss every N epochs

# ── SFT arm ───────────────────────────────────────────────────────────────────
sft:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"   # Word2World: 1.5B already captures core
                                              #   dynamics in structured envs
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # all linear
  epochs: 5                           # Word2World trains 5 epochs (was 3)
  min_steps: 20                       # floor for tiny budgets, from the pilot (9 Nov 2026,
                                      #   ALFWorld, 2 held-out training games): n=32 peaks at
                                      #   step 20 (exact 0.365) vs 0.280 at 5 epochs (10 steps),
                                      #   then flat ~0.335; n=1024 plateaus from ~1 epoch
                                      #   (0.60-0.615), 5 epochs = 0.585 (within noise)
  batch_size: 16                      # examples per optimiser step
  micro_batch: 4                      # examples per forward pass (memory)
  lr: 2e-4                            # usual LoRA rate (Word2World's 1e-5 is full FT)
  warmup_steps: 10                    # Word2World: constant LR with 10 warmup steps
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_len: 1024                   # prompts reach ~700 tokens; [ADMISSIBLE] list removed
  max_new_tokens: 192                 # answers are ~10-15 tokens (longest ~230 chars/4)
  gen_batch: 32                       # greedy decoding batch

# ── RAG arm ───────────────────────────────────────────────────────────────────
rag:
  generator_model: "Qwen/Qwen2.5-7B-Instruct"
  retriever_model: "nvidia/NV-Embed-v2"
  top_k_stage1: 50                    # top-50 by obs similarity
  top_k_stage2: 5                     # re-rank by action similarity, return 5

# ── Data budgets ──────────────────────────────────────────────────────────────
data:
  budgets: [32, 64, 128, 256, 512, 1024]
  collection_policy:                  # mixed policy for data collection
    expert: 0.50
    random: 0.30
    llm: 0.20

# ── Environments ──────────────────────────────────────────────────────────────
environments:
  - name: alfworld
    hidden_state: false               # never pass hidden state — Saanvi's fix
    agentgym: true
  - name: scienceworld
    hidden_state: false
    agentgym: true
  - name: webshop
    hidden_state: false
    agentgym: true
  - name: bytesized32
    hidden_state: false
    json_states: true                 # ground-truth JSON available

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  decision_utility:
    k_candidates: 5                   # K candidate actions per branched state
    scorer_model: "Qwen/Qwen2.5-7B-Instruct"
  fidelity:
    judge_model: "google/gemma-3-27b-it"   # LM-as-judge
    scale: [1, 10]
